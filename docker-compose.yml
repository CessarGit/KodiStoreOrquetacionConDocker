# =============================================================================
#  Ecosistema de producción: Next.js + Laravel (PHP-FPM + Nginx) + MySQL
#  Levantar todo:   docker compose up -d --build
# -----------------------------------------------------------------------------
#  Navegador ──► frontend:3000 (Next.js)
#  Navegador ──► backend:8000 (Nginx) ──FastCGI──► laravel:9000 (PHP-FPM) ──► db:3306
#
#  Redes:
#    frontend_net : frontend <-> backend (Nginx)
#    backend_net  : backend (Nginx) <-> laravel <-> db   (internal: sin salida)
# =============================================================================
name: bootcamp-prod

# Bloques reutilizables (YAML anchors)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # ---------------------------------------------------------------------------
  # FRONTEND · Next.js
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend/KodiStore      # proyecto Next.js
      dockerfile: ../Dockerfile          # usa también ../Dockerfile.dockerignore
      target: runner
      args:
        NODE_VERSION: ${NODE_VERSION:-24-alpine}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api}
        NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:-http://localhost:3000}
    image: ${REGISTRY:-bootcamp}/frontend:${TAG:-1.0.0}
    restart: unless-stopped
    init: true                      # tini como PID 1: manejo correcto de señales
    environment:
      # Llamadas server-side (Server Components / Route Handlers) usan el DNS
      # interno de Docker; el navegador usa NEXT_PUBLIC_API_URL.
      API_INTERNAL_URL: http://backend/api
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - frontend_net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    <<: *hardening
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # BACKEND · Nginx (proxy inverso, puerto público de la API)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend/e-commerce      # proyecto Laravel
      dockerfile: ../Dockerfile          # usa también ../Dockerfile.dockerignore
      additional_contexts:
        docker-config: ./backend/docker  # configs de PHP, Nginx y entrypoint
      target: nginx
    image: ${REGISTRY:-bootcamp}/api-nginx:${TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      laravel:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # BACKEND · Laravel (PHP-FPM). No publica puertos: solo Nginx le habla.
  # ---------------------------------------------------------------------------
  laravel:
    build:
      context: ./backend/e-commerce
      dockerfile: ../Dockerfile
      additional_contexts:
        docker-config: ./backend/docker
      target: production
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    image: ${REGISTRY:-bootcamp}/api-php:${TAG:-1.0.0}
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-BootcampAPI}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env (ver README)}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}   # CORS
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: db                    # nombre del servicio = DNS interno
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      CACHE_STORE: ${CACHE_STORE:-file}      # Laravel 11+
      CACHE_DRIVER: ${CACHE_STORE:-file}     # Laravel 10
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      HASH_DRIVER: ${HASH_DRIVER:-argon2id}
      # Autenticación JWT (php-open-source-saver/jwt-auth)
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (ver README)}
      JWT_ALGO: ${JWT_ALGO:-HS256}
      # Pasarela de pago Stripe
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "env -i SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    <<: *hardening
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # BASE DE DATOS · MySQL (imagen oficial, sin puertos expuestos al host)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:${MYSQL_VERSION:-8.0}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Define MYSQL_DATABASE en .env}
      MYSQL_USER: ${MYSQL_USER:?Define MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql                              # persistencia
      - ./database/init:/docker-entrypoint-initdb.d:ro      # solo 1er arranque
    # Sin "ports:" -> 3306 solo es accesible dentro de backend_net
    expose:
      - "3306"
    networks:
      - backend_net
    healthcheck:
      # TCP (127.0.0.1) y no socket: durante la inicialización MySQL arranca sin
      # red, así el servicio solo se marca "healthy" cuando está listo de verdad.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    <<: *hardening
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging: *default-logging

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge
    internal: true      # la BD y PHP-FPM no tienen salida a Internet

volumes:
  db_data:
    name: bootcamp_db_data
