# Nginx como proxy inverso para Laravel (PHP-FPM en el servicio `laravel`)
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    server_tokens off;            # no revelar la versión de Nginx
    client_max_body_size 20m;

    # DNS interno de Docker: se re-resuelve el nombre `laravel` cada 10 s,
    # así un reinicio del contenedor (IP nueva) no rompe el proxy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream laravel:9000;

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión de respuestas JSON/texto
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/xml;

    # Healthcheck del propio Nginx (no pasa por PHP)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # Único punto de entrada PHP
    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Bloquea cualquier otro .php y archivos ocultos (.env, .git, ...)
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
