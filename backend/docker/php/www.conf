; Sobrescribe el pool [www] por defecto de la imagen oficial
[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Endpoint usado por el HEALTHCHECK (cgi-fcgi)
ping.path = /ping
ping.response = pong

; Pasa las variables de entorno del contenedor a PHP (DB_HOST, APP_KEY, ...)
clear_env = no

; Logs de los workers a stdout/stderr del contenedor (docker logs)
catch_workers_output = yes
decorate_workers_output = no
